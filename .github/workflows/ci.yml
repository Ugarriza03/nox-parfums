# CI de NOX Parfums — sólo verifica. No despliega, no publica, no escribe
# datos externos y no usa secretos.
#
# Qué corre y en qué orden (detalle en docs/NOX-ADMIN.md):
#   1. verificar     npm ci → integridad + identificadores (falla rápido) →
#                    next build → navegador de Playwright → npm run qa
#                    (incluye preview + E2E y qa:admin) → test:layout →
#                    E2E de NOX Admin sin Supabase → qa:sync
#   3. admin-sql     migraciones de NOX Admin sobre PostgreSQL desechable:
#                    RLS, permisos, MFA, stock negativo, concurrencia e
#                    historial inmutable (sin conexión a Supabase real)
#   2. dependencias  npm audit sobre el lockfile, en dos partes:
#                    · producción (--omit=dev): BLOQUEANTE ante alta/crítica
#                    · completa (incluye desarrollo): informativa, visible
#                    Si una auditoría no corre o su JSON es inválido, el job
#                    falla: nunca se interpreta como "cero vulnerabilidades".
#
# Los jobs son independientes: una vulnerabilidad conocida pone el job
# "dependencias" en rojo sin ocultar el resultado de "verificar", y viceversa.

name: CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - develop
  workflow_dispatch:

# Permisos mínimos: el token sólo puede leer el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Build y QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalación reproducible
        run: npm ci

      # Barato (segundos) y bloqueante: si un slug, una portada, un perfil o un
      # precio cambió sin aprobar, no tiene sentido seguir. npm run qa los
      # vuelve a correr al principio; se aceptan esos segundos a cambio de
      # fallar antes del build.
      - name: Integridad de los 233 productos e identificadores estables
        run: |
          npm run qa:integridad
          npm run qa:ids

      - name: Build de producción (sin desplegar)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Navegador para las pruebas E2E
        run: npx playwright install --with-deps chromium

      # npm run qa ya incluye: catálogo, performance, mayoristas, match,
      # olfativo, import, preview, lotes, redacción, pedido, asesor y test:e2e.
      # Por eso test:e2e no se repite como paso propio.
      - name: Suite de QA (incluye preview y E2E)
        run: npm run qa

      - name: Layout sin scroll horizontal (390 px)
        run: npm run test:layout

      # Servidor de producción local (next start) sin Supabase, producción
      # deshabilitada y Supabase inaccesible: el panel nunca expone datos y la
      # tienda no depende de él.
      - name: E2E de NOX Admin (sin Supabase real)
        run: npm run test:admin:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # qa:sync no forma parte de npm run qa y en main (c98bea1) ya falla un
      # chequeo ("Rasasi sigue en Árabes"). Se corre a la vista, sin bloquear,
      # hasta que se decida su corrección. Ver docs/NOX-ADMIN.md.
      - name: qa:sync (falla preexistente documentada, no bloqueante)
        run: npm run qa:sync
        continue-on-error: true

  admin-sql:
    name: NOX Admin — pruebas SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Contenedor desechable del job, accesible sólo desde el runner:
          # sin contraseña, así no hay ninguna credencial en el repositorio.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Base desechable del propio job: no hay datos ni credenciales reales.
      - name: Migraciones, RLS, permisos y concurrencia
        run: bash supabase/tests/run.sh

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Analizador común de los dos informes. Vive sólo en el runner
      # ($RUNNER_TEMP) y no se versiona: este workflow es su única fuente.
      #   node reporte.js <informe.json> <bloqueante|informativo> [produccion.json]
      # Sale con 1 si el informe no existe, está vacío, no es JSON, trae un
      # campo "error" o no tiene los contadores esperados. En modo bloqueante
      # sale con 1 además ante vulnerabilidades altas o críticas.
      - name: Preparar analizador de npm audit
        run: |
          cat > "$RUNNER_TEMP/reporte.js" <<'EOF'
          const fs = require("fs");
          const [archivo, modo, archivoProduccion] = process.argv.slice(2);
          const bloqueante = modo === "bloqueante";
          const titulo = bloqueante
            ? "npm audit — producción (--omit=dev) · bloqueante"
            : "npm audit — completo (incluye desarrollo) · informativo";
          const resumen = (texto) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, texto + "\n");

          function leer(ruta) {
            let texto;
            try { texto = fs.readFileSync(ruta, "utf8"); }
            catch { return { error: `no se encontró ${ruta}` }; }
            if (!texto.trim()) return { error: `${ruta} está vacío` };
            let r;
            try { r = JSON.parse(texto); }
            catch (e) { return { error: `${ruta} no es JSON válido (${e.message})` }; }
            if (r.error) return { error: `npm audit devolvió un error: ${r.error.summary ?? JSON.stringify(r.error)}` };
            const v = r.metadata?.vulnerabilities;
            const claves = ["critical", "high", "moderate", "low"];
            if (!v || claves.some((k) => !Number.isInteger(v[k]))) {
              return { error: `${ruta} no tiene los contadores metadata.vulnerabilities esperados` };
            }
            return { r, v };
          }

          const informe = leer(archivo);
          if (informe.error) {
            resumen(`## ${titulo}\n\n**ERROR: la auditoría no pudo evaluarse.** ${informe.error}\n`);
            console.log(`::error title=${titulo}::${informe.error}. No se interpreta como cero vulnerabilidades.`);
            process.exit(1);
          }

          // En el informe completo, marcar qué paquetes también afectan producción.
          let enProduccion = null;
          if (!bloqueante && archivoProduccion) {
            const prod = leer(archivoProduccion);
            enProduccion = prod.error ? null : new Set(Object.keys(prod.r.vulnerabilities ?? {}));
          }
          const alcance = (nombre) =>
            enProduccion === null ? "sin dato" : enProduccion.has(nombre) ? "producción" : "sólo desarrollo";

          const { r, v } = informe;
          const filas = Object.entries(r.vulnerabilities ?? {}).map(([nombre, d]) => {
            const via = (d.via ?? []).map((x) => typeof x === "string" ? x : x.title).filter(Boolean);
            const fix = d.fixAvailable === true ? "sí" :
              d.fixAvailable ? `${d.fixAvailable.name}@${d.fixAvailable.version}${d.fixAvailable.isSemVerMajor ? " (major)" : ""}` : "no";
            const columnas = [nombre, d.severity, d.isDirect ? "directa" : "transitiva"];
            if (!bloqueante) columnas.push(alcance(nombre));
            columnas.push(d.range, fix, via.slice(0, 3).join("; "));
            // Un "|" dentro de un rango (p. ej. "a || b") rompería la tabla.
            return `| ${columnas.map((c) => String(c).replace(/\|/g, "\\|")).join(" | ")} |`;
          });
          const cabecera = bloqueante
            ? "| Paquete | Severidad | Tipo | Rango afectado | Corrección | Avisos |\n|---|---|---|---|---|---|"
            : "| Paquete | Severidad | Tipo | Alcance | Rango afectado | Corrección | Avisos |\n|---|---|---|---|---|---|---|";
          const graves = v.critical + v.high;
          const veredicto = bloqueante
            ? (graves > 0 ? "**FALLA:** hay vulnerabilidades altas o críticas en dependencias de producción." : "**OK:** sin vulnerabilidades altas ni críticas en producción.")
            : "Informativo: no hace fallar el job por sí mismo. El control obligatorio es la auditoría de producción.";
          const md = [
            `## ${titulo}`,
            "",
            `crítica ${v.critical} · alta ${v.high} · moderada ${v.moderate} · baja ${v.low}`,
            "",
            veredicto,
            "",
            filas.length ? `${cabecera}\n${filas.join("\n")}` : "Sin vulnerabilidades reportadas.",
            ""
          ].join("\n");
          resumen(md);
          console.log(md);

          if (bloqueante && graves > 0) {
            console.log(`::error title=${titulo}::${graves} vulnerabilidad(es) alta(s) o crítica(s) en producción. Ver el resumen del job.`);
            process.exit(1);
          }
          if (!bloqueante && graves > 0) {
            console.log(`::warning title=${titulo}::${graves} vulnerabilidad(es) alta(s) o crítica(s) en el árbol completo. Ver la columna Alcance del resumen.`);
          }
          EOF

      # Sólo leen el lockfile: no instalan ni ejecutan código de terceros.
      # Nunca se corre `npm audit fix` desde CI. El código de salida de npm no
      # se usa para decidir (vale 1 tanto con hallazgos como con errores): la
      # decisión la toma el analizador a partir del JSON.
      - name: npm audit — producción (bloqueante)
        run: |
          npm audit --package-lock-only --omit=dev --json > audit-produccion.json 2> audit-produccion.stderr.txt || true
          if [ -s audit-produccion.stderr.txt ]; then cat audit-produccion.stderr.txt; fi
          node "$RUNNER_TEMP/reporte.js" audit-produccion.json bloqueante

      # Corre aunque falle la de producción, para que el informe completo
      # siempre quede visible. Sólo falla si no puede evaluarse.
      - name: npm audit — completo (informativo)
        if: ${{ !cancelled() }}
        run: |
          npm audit --package-lock-only --json > audit.json 2> audit.stderr.txt || true
          if [ -s audit.stderr.txt ]; then cat audit.stderr.txt; fi
          node "$RUNNER_TEMP/reporte.js" audit.json informativo audit-produccion.json

      - name: Guardar reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: |
            audit.json
            audit-produccion.json
          if-no-files-found: warn
          retention-days: 14
